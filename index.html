<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>TaskMaster. - Productive Daily Tracker</title>
        <script src="https://cdn.tailwindcss.com"></script>
          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
              <script>
                  tailwind.config = {
                        theme: {
                                extend: {
                                          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                                                    colors: {
                                                                brand: { green: '#10b981', orange: '#ff6b52', purple: '#8b5cf6', blue: '#3b82f6', dark: '#18181b', bg: '#f8fafc' }
                                                                          }
                                                                                  }
                                                                                        }
                                                                                            }
                                                                                              </script>
                                                                                              </head>
                                                                                              <body class="bg-[#f4f5f7] text-slate-800 antialiased font-sans min-h-screen">
                                                                                                <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative flex flex-col justify-between">
                                                                                                    <!-- Top Bar -->
                                                                                                        <header class="p-5 pb-3 flex justify-between items-center">
                                                                                                              <div>
                                                                                                                      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">TaskMaster<span class="text-emerald-500">.</span></h1>
                                                                                                                              <p class="text-xs font-semibold text-slate-400">Start Your Day & Be Productive ✌️</p>
                                                                                                                                    </div>
                                                                                                                                          <button id="configBtn" onclick="toggleModal(true)" class="p-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
                                                                                                                                                  ⚙️
                                                                                                                                                        </button>
                                                                                                                                                            </header>

                                                                                                                                                                <!-- Main Content Slot -->
                                                                                                                                                                    <main class="p-5 pt-2 space-y-5 flex-1">
                                                                                                                                                                          <!-- Banner -->
                                                                                                                                                                                <div class="bg-slate-900 text-white rounded-3xl p-4 flex items-center justify-between shadow-lg">
                                                                                                                                                                                        <div class="flex items-center space-x-3">
                                                                                                                                                                                                  <span class="text-xl">✍️</span>
                                                                                                                                                                                                            <div>
                                                                                                                                                                                                                        <p id="bannerText" class="text-xs font-bold">You have 0 tasks today. Keep it up!</p>
                                                                                                                                                                                                                                    <p class="text-[10px] text-slate-400">Synced to Google Sheets Backend</p>
                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                  <!-- Add Task Form -->
                                                                                                                                                                                                                                                                        <div class="bg-slate-50 border border-slate-100 rounded-3xl p-4 space-y-3">
                                                                                                                                                                                                                                                                                <input id="taskInput" type="text" placeholder="Add a new task title..." class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-3 text-xs font-medium focus:outline-none focus:border-emerald-500">
                                                                                                                                                                                                                                                                                        <div class="flex justify-between items-center gap-2">
                                                                                                                                                                                                                                                                                                  <label class="flex items-center space-x-2 text-xs font-medium text-slate-600 cursor-pointer">
                                                                                                                                                                                                                                                                                                              <input id="permCheck" type="checkbox" class="accent-emerald-500 rounded">
                                                                                                                                                                                                                                                                                                                          <span>Permanent Daily Task</span>
                                                                                                                                                                                                                                                                                                                                    </label>
                                                                                                                                                                                                                                                                                                                                              <button onclick="addTask()" class="bg-emerald-500 text-white font-bold text-xs px-5 py-2.5 rounded-2xl hover:bg-emerald-600 transition shadow-sm">
                                                                                                                                                                                                                                                                                                                                                          Add Task
                                                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                        <!-- Task List -->
                                                                                                                                                                                                                                                                                                                                                                                              <div class="space-y-3">
                                                                                                                                                                                                                                                                                                                                                                                                      <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Today's Tasks</h3>
                                                                                                                                                                                                                                                                                                                                                                                                              <div id="taskList" class="space-y-2"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Settings Modal -->
                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
                                                                                                                                                                                                                                                                                                                                                                                                                                              <h2 class="text-lg font-bold text-slate-900">Google Sheets Settings</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p class="text-xs text-slate-500">Paste your Web App URL from Apps Script deployment here to sync login & task data.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                              <input id="webAppUrl" type="text" placeholder="https://script.google.com/macros/s/..." class="w-full border border-slate-200 rounded-2xl p-3 text-xs focus:outline-none focus:border-emerald-500">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="flex justify-end gap-2">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="toggleModal(false)" class="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button onclick="saveUrl()" class="px-5 py-2 bg-emerald-500 text-white text-xs font-bold rounded-2xl">Save & Sync</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let tasks = JSON.parse(localStorage.getItem('tm_tasks')) || [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let scriptUrl = localStorage.getItem('tm_url') || '';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function saveTasks() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  localStorage.setItem('tm_tasks', JSON.stringify(tasks));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function toggleModal(show) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById('settingsModal').classList.toggle('hidden', !show);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(show) document.getElementById('webAppUrl').value = scriptUrl;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function saveUrl() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          scriptUrl = document.getElementById('webAppUrl').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                localStorage.setItem('tm_url', scriptUrl);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      toggleModal(false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert('Backend URL saved!');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function addTask() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const input = document.getElementById('taskInput');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const isPerm = document.getElementById('permCheck').checked;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!input.value.trim()) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  tasks.push({ id: Date.now(), title: input.value.trim(), done: false, perm: isPerm });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        input.value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('permCheck').checked = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    saveTasks();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function toggleTask(id) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        saveTasks();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function render() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const list = document.getElementById('taskList');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            list.innerHTML = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const doneCount = tasks.filter(t => t.done).length;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('bannerText').innerText = `You have ${tasks.length - doneCount} tasks remaining today. Keep it up!`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              tasks.forEach(t => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const item = document.createElement('div');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              item.className = `flex items-center justify-between p-3.5 rounded-2xl border ${t.done ? 'bg-slate-50 border-slate-100 opacity-60' : 'bg-white border-slate-200'} transition`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      item.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="flex items-center space-x-3">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})" class="accent-emerald-500 w-4 h-4 rounded">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span class="text-xs font-bold ${t.done ? 'line-through text-slate-400' : 'text-slate-800'}">${t.title}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ${t.perm ? '<span class="text-[10px] font-extrabold bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">Permanent</span>' : ''}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            list.appendChild(item);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
